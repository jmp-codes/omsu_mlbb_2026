<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OMSU Siglakas 2026, MLBB Tournament</title>
<style>
:root{
  --paper:#eceff5;--surface:#ffffff;--sunk:#f2f4f9;--ink:#0f1b3d;--mute:#5a6684;--line:#d9deea;
  --brand:#2447d6;--brand-ink:#ffffff;--brand-soft:#e3e9ff;
  --win-bg:#0f1b3d;--win-fg:#ffffff;--gold:#d99a00;--bad:#c4372c;
  --bar:#0f1b3d;--bar-ink:#ffffff;--bar-mute:#9fb0dc;
  --display:"Bahnschrift","DIN Alternate","Arial Narrow",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --r-Gold:#c98a00;--r-Mid:#8a4fe0;--r-Jungle:#1c9a5e;--r-EXP:#e2552b;--r-Roam:#0b9bbd;--r-Sub:#7b87a6;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#0a1020;--surface:#121a33;--sunk:#0e152b;--ink:#e9eefc;--mute:#93a1c6;--line:#243157;
    --brand:#7b97ff;--brand-ink:#0a1020;--brand-soft:#1a2750;--win-bg:#2b43a0;--win-fg:#ffffff;--bad:#ff7b70;
    --bar:#0d1530;--r-Gold:#f0b429;--r-Mid:#b58cff;--r-Jungle:#3ddc97;--r-EXP:#ff8a5b;--r-Roam:#4fd1f0}
}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--body)}
button{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;letter-spacing:.01em}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mute{color:var(--mute)}
i{font-style:normal;color:var(--mute)}

/* top bar */
.bar{background:var(--bar);color:var(--bar-ink);position:sticky;top:0;z-index:10}
.bar-in{max-width:1280px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.bar h1{font-size:22px;font-weight:700;line-height:1.1}
.brand{display:flex;flex-direction:column}
#sub{font-size:13px;color:var(--bar-mute);font-weight:600}
#nav{display:flex;gap:2px;flex-wrap:wrap}
#nav button{background:none;border:0;color:var(--bar-mute);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
#nav button:hover{color:#fff}
#nav button.on{background:rgba(255,255,255,.15);color:#fff}
main{max-width:1280px;margin:0 auto;padding:22px 20px 70px}

/* page structure */
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h2{font-size:26px}
.sub{color:var(--mute);margin:3px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{margin-top:26px}
.sec>h3{font-size:18px;margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.ct{font-size:16px;margin-bottom:10px}
.ct small{font:400 13px var(--body);color:var(--mute);margin-left:6px}
.empty-card{max-width:560px}
.empty-card h3{font-size:20px;margin-bottom:6px}
.empty-card p{color:var(--mute);margin:0 0 14px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.note{color:var(--mute);font-size:13px;margin:10px 0 0}

/* buttons and inputs */
.btn{background:var(--brand);color:var(--brand-ink);border:1px solid var(--brand);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--line)}
.btn.sm{padding:5px 10px;font-size:13px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
input[type=search]{width:100%}
select{cursor:pointer}

/* tables */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:600;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:13px;white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.adv td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
.tbl .rk{width:34px;font-family:var(--display);font-weight:700;color:var(--mute)}
.tbl tr.adv .rk{color:var(--brand)}
.tag-tie{font-size:12px;background:var(--brand-soft);color:var(--brand);border-radius:5px;padding:1px 6px;margin-left:6px}
.tbb{margin-left:4px}
.tbb button{border:1px solid var(--line);background:var(--surface);border-radius:5px;cursor:pointer;font-size:11px;padding:1px 5px;margin-left:2px}
.bar-cell{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.meter{width:70px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand)}

/* roles */
.rd{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.role-Gold{--rc:var(--r-Gold)}.role-Mid{--rc:var(--r-Mid)}.role-Jungle{--rc:var(--r-Jungle)}.role-EXP{--rc:var(--r-EXP)}.role-Roam{--rc:var(--r-Roam)}.role-Sub{--rc:var(--r-Sub)}
.rd{background:var(--rc)}
.rtxt{color:var(--rc);font-weight:600}

/* match cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mc{display:block;width:100%;text-align:left;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer}
.mc:disabled{cursor:default;opacity:.7}
.mc:not(:disabled):hover{border-color:var(--brand)}
.mc-h{display:flex;gap:8px;align-items:baseline;padding:7px 12px;background:var(--sunk);border-bottom:1px solid var(--line);font-size:12px;color:var(--mute)}
.mc-h b{color:var(--ink);font-family:var(--display);font-size:13px}
.mc-h .bo{margin-left:auto}
.mc-row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:9px 12px}
.mc-row+.mc-row{border-top:1px solid var(--line)}
.mc-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mc-row .sc{font:700 20px var(--display);min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.mc-row.win{background:var(--win-bg);color:var(--win-fg)}
.mc-row.lose{color:var(--mute)}
.mc-row.lose .nm{font-weight:500}
.mc-f{padding:6px 12px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.mc.ready .mc-f{color:var(--brand);font-weight:600}
.mc.live .mc-f{color:var(--gold);font-weight:600}
.tg{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--sunk);font:700 12px var(--display);color:var(--mute)}
.mc-row.win .tg{background:rgba(255,255,255,.18);color:#fff}
.slotrow{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:start;margin-bottom:14px}
.slotlab{font:700 15px var(--display);padding-top:8px;color:var(--mute)}
@media(max-width:700px){.slotrow{grid-template-columns:1fr}}

/* playoff bracket */
.po-wrap{overflow-x:auto}
.po{display:flex;align-items:stretch;min-width:max-content}
.po-col{display:flex;flex-direction:column;justify-content:space-around;gap:18px;width:260px;flex:none}
.po-join{width:40px;position:relative;flex:none}
.po-join::before{content:'';position:absolute;left:0;right:50%;top:25%;bottom:25%;border:2px solid var(--line);border-left:0}
.po-join::after{content:'';position:absolute;left:50%;right:0;top:50%;border-top:2px solid var(--line)}
.po-join1{width:40px;position:relative;flex:none}
.po-join1::after{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--line)}
.elim{display:flex;gap:40px;overflow-x:auto;padding-bottom:8px}
.elim .round{display:flex;flex-direction:column;width:260px;flex:none}
.elim .rm{display:flex;flex-direction:column;justify-content:space-around;gap:16px;flex:1}
.mc.bye{opacity:.8}

/* banners and placings */
.champ{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;padding:14px 18px;margin-bottom:6px}
.champ .lab{color:var(--mute);font-size:13px}
.champ .nmx{font:700 26px var(--display)}
.placings{display:grid;gap:10px}
.pl-row{display:flex;align-items:center;gap:14px}
.medal{min-width:130px;text-align:center;border-radius:6px;padding:3px 10px;font:700 13px var(--display);background:var(--sunk);border:1px solid var(--line)}
.medal.m1{background:var(--gold);color:#fff;border-color:var(--gold)}
.medal.m2{background:#9aa5bd;color:#fff;border-color:#9aa5bd}
.medal.m3{background:#b4743a;color:#fff;border-color:#b4743a}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.team-h{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.team-h .ord{font:700 13px var(--display);background:var(--ink);color:var(--paper);border-radius:6px;padding:4px 8px}
.team-h input{flex:1;font-weight:700;font-size:15px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;padding:6px 9px;line-height:1}
.icon-btn:hover{border-color:var(--brand)}
.pl{display:grid;grid-template-columns:90px 1fr 1fr 32px;gap:6px;margin-bottom:6px}
.pl select{border-left:4px solid var(--rc);font-weight:600}

/* rankings and analysis */
.leaders{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.lead{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.lead .rd{margin-top:5px}
.lead small{display:block;color:var(--mute)}
.lead b{display:block;font:700 17px var(--display)}
.lead span{color:var(--mute);font-size:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{background:var(--surface);border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:99px;cursor:pointer;font-weight:600}
.pills button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.stack>.card{margin-bottom:16px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px}
.pgs{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pgs button{min-width:34px;padding:5px 9px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-weight:600}
.pgs button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pgs button:disabled{opacity:.45;cursor:default}
.pgs button:not(:disabled):not(.on):hover{border-color:var(--brand)}

/* settings */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sgrid h3{font-size:17px;margin-bottom:6px}
.sgrid p{color:var(--mute);margin:0 0 12px}

/* match sheet */
.overlay{position:fixed;inset:0;display:none;background:rgba(8,14,32,.55);z-index:40;justify-content:flex-end}
.overlay.open{display:flex}
#picker{z-index:50;justify-content:center;align-items:center}
.sheet{background:var(--paper);width:min(1180px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
@media (prefers-reduced-motion:no-preference){.overlay.fresh .sheet{animation:slidein .18s ease-out}@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.sheet-h h2{font-size:22px}
.bug{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;margin:16px 22px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.bug-t{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:18px}
.bug-t b{font-family:var(--display);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bug-t .big{font:700 40px var(--display);font-variant-numeric:tabular-nums}
.bug-t.r{flex-direction:row-reverse;text-align:right}
.bug-t.w{background:var(--win-bg);color:var(--win-fg)}
.bug-t.w .tg{background:rgba(255,255,255,.18);color:#fff}
.bug-mid{display:grid;place-items:center;padding:0 16px;color:var(--mute);font-size:13px;border-inline:1px solid var(--line);text-align:center}
.gtabs{display:flex;gap:6px;flex-wrap:wrap;padding:16px 22px 0}
.gt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;text-align:left}
.gt small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.gt.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.gt.on small{color:inherit;opacity:.85}
.gbody{padding:16px 22px 24px;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);margin-bottom:12px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:9px 16px;cursor:pointer;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--win-bg);color:var(--win-fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:980px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--sunk);border-bottom:1px solid var(--line)}
.panel-h b{font:700 16px var(--display)}
.panel-h span{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.pr{display:grid;grid-template-columns:minmax(100px,1.1fr) minmax(120px,1fr) auto 36px;grid-template-areas:"who hero kda mvp" "build build build build";gap:8px 10px;padding:10px 12px;border-top:1px solid var(--line);align-items:center}
.pr:first-of-type{border-top:0}
.who{grid-area:who;display:flex;gap:8px;align-items:center;min-width:0}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{display:block;color:var(--rc);font-weight:600}
.hero-btn{grid-area:hero;border:1px dashed var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--mute)}
.hero-btn.set{border-style:solid;color:var(--ink);font-weight:600}
.hero-btn:hover{border-color:var(--brand)}
.kda{grid-area:kda;display:flex;gap:4px}
.kda input{width:50px;text-align:center;padding:7px 2px}
.star{grid-area:mvp;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font-size:17px;color:var(--mute)}
.star.on{background:var(--gold);border-color:var(--gold);color:#fff}
.build{grid-area:build;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.add-items{border:1px dashed var(--line);background:none;border-radius:6px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--brand);font-weight:600}
.add-items:hover{border-color:var(--brand)}
.sheet-f{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px;background:var(--surface);border-top:1px solid var(--line)}
.sheet-f .dirty{color:var(--gold);font-weight:600}
.empty{color:var(--mute);padding:20px 0}

/* picker */
.dlg{background:var(--surface);border-radius:12px;width:min(780px,96vw);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:18px}
.dlg-s{padding:10px 16px 6px}
.dlg .pills{padding:0 16px 8px}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:12px 16px 0}
.slot-b{min-height:40px;border:1px dashed var(--line);border-radius:8px;padding:4px 6px;font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:4px;color:var(--mute)}
.slot-b.f{border-style:solid;color:var(--ink);background:var(--sunk);font-weight:600}
.slot-b button{border:0;background:none;cursor:pointer;color:var(--mute);font-size:14px}
@media(max-width:640px){.slots{grid-template-columns:repeat(3,1fr)}}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;overflow:auto;padding:8px 16px 16px}
.pk{padding:8px 10px;text-align:left;border:1px solid var(--line);border-radius:7px;background:var(--surface);cursor:pointer;font-size:13px}
.pk:hover{border-color:var(--brand)}
.pk.sel{background:var(--brand-soft);border-color:var(--brand);font-weight:600}
.pk.custom{border-style:dashed;color:var(--brand);font-weight:600}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;font-weight:600}
#toast.show{opacity:1}
.h2h-w{background:var(--brand-soft);color:var(--brand)}
.h2h-l{background:var(--sunk);color:var(--mute)}
.fm{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font:700 12px var(--display);margin-right:3px}
.fm.fw{background:var(--win-bg);color:var(--win-fg)}
.fm.fl{background:var(--sunk);color:var(--mute);border:1px solid var(--line)}
#auth{z-index:60;justify-content:center;align-items:center}
.sync{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--bar-mute)}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#8a96b8;display:inline-block;margin-right:6px}
.sync .dot.live{background:#3ddc97}.sync .dot.warn{background:#f0b429}.sync .dot.off{background:#ff7b70}
.sync button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
body.viewer .ed{display:none!important}
.dlg.sm{width:min(380px,94vw);padding:18px;gap:10px}
.dlg.sm h3{font-size:18px}
.err{color:var(--bad);min-height:1.2em;margin:0;font-size:13px}
@media print{.bar,.acts,.overlay,#toast{display:none!important}body{background:#fff}}
/* ===== esports theme: deep violet ===== */
:root,:root[data-theme]{
  --paper:#07040f;--surface:#140c2c;--sunk:#1c1240;--ink:#f3eeff;--mute:#a99dcc;--line:rgba(150,112,255,.30);
  --brand:#8b5cf6;--brand-ink:#ffffff;--brand-soft:rgba(139,92,246,.24);--accent:#b9a2ff;
  --win-bg:#5b2fd1;--win-fg:#ffffff;--gold:#f5b942;--bad:#ff8a9a;--bar:#0b0620;--bar-ink:#ffffff;--bar-mute:#b4a6e6;
  --r-Gold:#f0b429;--r-Mid:#b58cff;--r-Jungle:#3ddc97;--r-EXP:#ff8a5b;--r-Roam:#4fd1f0;--r-Sub:#9aa5c7;
  --display:"Bahnschrift","DIN Alternate","Arial Narrow",system-ui,sans-serif;
}
html{color-scheme:dark}
body{background:radial-gradient(900px 420px at 85% -8%,rgba(124,58,237,.38),transparent 70%),radial-gradient(700px 500px at -5% 100%,rgba(91,33,182,.28),transparent 70%),#07040f;background-attachment:fixed;color:var(--ink)}
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
/* header */
.bar{background:linear-gradient(100deg,#0b0620 0%,#1a0d45 55%,#2b1270 100%);border-bottom:1px solid var(--line);box-shadow:0 6px 30px rgba(80,30,200,.28)}
.bar-in{position:relative;overflow:hidden;gap:16px;padding:12px 20px;max-width:1500px;flex-wrap:nowrap}
@media(max-width:1180px){.bar-in{flex-wrap:wrap}}
.bar-in>*{position:relative;z-index:1}
.hero{position:absolute!important;right:0;top:0;height:100%;width:380px;z-index:0!important;pointer-events:none}
.hlogo{width:58px;height:58px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 0 0 2px #f5b942,0 0 22px rgba(167,123,255,.65)}
.bar h1{font-size:26px;letter-spacing:.01em}
#sub{color:var(--bar-mute);font-size:14px}
#nav{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;margin-left:8px}
#nav button{display:flex;align-items:center;gap:7px;border-radius:999px;padding:8px 12px;color:#cdc2f5}
#nav button.on{background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;box-shadow:0 0 18px rgba(139,92,246,.7)}
.sync{margin-left:auto;color:#d7cdf7;white-space:nowrap}
.sync button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:10px}
main{max-width:1500px}
/* surfaces */
.card,.panel,.lead,.champ,.mc{background:linear-gradient(160deg,rgba(46,25,100,.88),rgba(20,11,46,.94));border:1px solid var(--line);box-shadow:0 0 0 1px rgba(139,92,246,.06),0 10px 30px rgba(50,18,130,.28)}
.card,.champ{border-radius:16px}
.panel-h,.mc-h{background:rgba(139,92,246,.14)}
.btn{background:linear-gradient(135deg,#8b5cf6,#5b21b6);border-color:#8b5cf6;color:#fff;box-shadow:0 0 14px rgba(139,92,246,.35)}
.btn.ghost{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--ink);box-shadow:none}
.btn.ghost:hover{border-color:#a78bfa}
.btn.bad{background:rgba(255,255,255,.05);color:var(--bad);box-shadow:none}
input,select{background:rgba(255,255,255,.06);border-color:var(--line);color:var(--ink)}
input::placeholder{color:#8478ad}
select option{background:#140c2c;color:#f3eeff}
.pills button{background:rgba(255,255,255,.05)}
.pills button.on{background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;border-color:#8b5cf6}
.pgs button{background:rgba(255,255,255,.05);color:var(--ink)}
.pgs button.on{background:#7c4dff;color:#fff;border-color:#7c4dff}
.tbl th{color:var(--accent)}
.tbl tr.adv td:first-child{box-shadow:inset 3px 0 0 #8b5cf6}
.tbl tr.adv .rk,.tag-tie,.add-items,.h2h-w{color:var(--accent)}
.tag-tie{background:var(--brand-soft)}
.meter{background:rgba(255,255,255,.08);border-color:var(--line)}
.meter i{background:linear-gradient(90deg,#8b5cf6,#c4a3ff)}
.sec>h3,.page-h h2{display:flex;align-items:center;gap:10px}
.sec>h3 .ic{width:24px;height:24px;color:var(--accent)}
.page-h h2{font-size:30px}
.fm.fw{background:#7c4dff}
.rk{color:var(--mute)}
/* badges */
.bdg{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 2px var(--tc,#8b5cf6),0 0 12px color-mix(in srgb,var(--tc,#8b5cf6) 70%,transparent);overflow:hidden}
.bdg img{width:100%;height:100%;object-fit:contain;display:block}
.bdg svg{width:20px;height:20px}
.bdg.empty{background:rgba(255,255,255,.06);box-shadow:none;border:1px dashed var(--line)}
.bdg[style*="--tc"]:not(:has(img)){background:rgba(255,255,255,.08)}
.tcell{display:inline-flex;align-items:center;gap:10px}
.tn em,.nm em{font-style:normal;color:var(--mute);font-weight:500}
.mc-row.win .nm em{color:#d8ccff}
.team-h .bdg{width:38px;height:38px}
.nick{width:100%;margin:-4px 0 10px}
/* match cards */
.mc{border-radius:14px;position:relative;transition:border-color .15s,box-shadow .15s}
.mc:not(:disabled):hover{border-color:#a78bfa;box-shadow:0 0 26px rgba(139,92,246,.45)}
.mc-h{padding:9px 14px;color:var(--mute)}
.mc-h b{color:#fff;font-size:15px}
.mc-h span:not(.bo)::before{content:"|";margin:0 8px 0 2px;color:var(--line)}
.mc-h .bo{background:rgba(139,92,246,.25);border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:#d6c9ff}
.mc-row{grid-template-columns:28px 32px 1fr auto;padding:9px 14px}
.mc-row .seed{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;background:rgba(255,255,255,.08);font:700 12px var(--display);color:var(--mute)}
.mc-row .nm{font-weight:500}
.mc-row .nm b{font-weight:700}
.mc-row.win{background:linear-gradient(90deg,#5b2fd1,#3a1c94)}
.mc-row.win .seed{background:rgba(255,255,255,.18);color:#fff}
.mc-row.lose{color:var(--mute)}
.mc-f{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--mute);background:linear-gradient(90deg,rgba(124,58,237,.35),rgba(124,58,237,.05))}
.mc-f .ic{width:16px;height:16px}
.mc-f span{flex:1}
.mc.ready .mc-f,.mc.live .mc-f{color:#fff;font-weight:600}
.mc.live .mc-f{color:var(--gold)}
.mc.wait{opacity:.7}
.tg{background:rgba(255,255,255,.08);color:var(--mute)}
.mgrid.one{grid-template-columns:minmax(0,520px)}
/* layout */
.bk-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media(max-width:1060px){.bk-grid{grid-template-columns:1fr}}
.bk-side{position:sticky;top:96px}
@media(max-width:1060px){.bk-side{position:static}}
.bk-side .sec{margin-top:26px}
.slotrow{grid-template-columns:96px minmax(0,1fr);align-items:center}
.slotlab{font:700 15px var(--display);color:#fff;padding:8px 14px;border-radius:8px 18px 18px 8px;background:linear-gradient(90deg,#3b5bdb,#2a3fa8);box-shadow:0 0 14px rgba(59,91,219,.5);text-align:center}
.slotrow.rr1 .slotlab{background:linear-gradient(90deg,#dc3545,#a3202f);box-shadow:0 0 14px rgba(220,53,69,.5)}
.slotrow.rr2 .slotlab{background:linear-gradient(90deg,#8b5cf6,#5b21b6);box-shadow:0 0 14px rgba(139,92,246,.55)}
@media(max-width:700px){.slotrow{grid-template-columns:1fr}.slotlab{width:fit-content}}
.final-wrap{position:relative;min-height:200px;border-radius:16px;padding:14px;background:radial-gradient(420px 220px at 78% 50%,rgba(139,92,246,.5),transparent 70%),linear-gradient(160deg,rgba(46,25,100,.6),rgba(20,11,46,.7));border:1px solid var(--line);overflow:hidden}
.final-wrap .trophy{position:absolute;right:6%;top:50%;transform:translateY(-50%);height:190px;width:auto;filter:drop-shadow(0 0 22px rgba(167,123,255,.8))}
.final-wrap .mgrid{position:relative;z-index:1}
@media(max-width:700px){.final-wrap .trophy{display:none}}
.bk-main,.bk-side,.bk-grid>*{min-width:0}.mgrid,.mgrid>*{min-width:0;max-width:100%}.final-wrap{box-sizing:border-box;max-width:100%}
/* champion */
.champ{display:flex;align-items:center;gap:18px;border-left:6px solid var(--gold);background:radial-gradient(500px 140px at 12% 50%,rgba(245,185,66,.28),transparent 70%),linear-gradient(160deg,rgba(46,25,100,.9),rgba(20,11,46,.95));margin-bottom:22px}
.champ .trophy{height:84px;width:auto}
.champ .nmx{display:flex;align-items:center;gap:12px;font-size:28px}
.champ .tn em{font-size:18px}
/* placings */
.placings{display:grid;gap:12px;padding:14px}
.pl-card{display:flex;align-items:center;gap:16px;border-radius:14px;padding:12px 16px;border:1px solid var(--line)}
.pl-card.m1{background:linear-gradient(100deg,rgba(245,185,66,.12),rgba(245,185,66,.42))}
.pl-card.m2{background:linear-gradient(100deg,rgba(180,190,215,.1),rgba(180,190,215,.34))}
.pl-card.m3{background:linear-gradient(100deg,rgba(205,127,50,.1),rgba(205,127,50,.38))}
.laurel{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;flex:none;font:700 20px var(--display);color:#fff;border:3px double currentColor;background:rgba(0,0,0,.28)}
.pl-card.m1 .laurel{color:#f5b942}.pl-card.m2 .laurel{color:#cfd6ea}.pl-card.m3 .laurel{color:#d98a4a}
.pl-card .pv{margin-top:6px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pl-card .mute{font-weight:400}
.medal{background:rgba(255,255,255,.1);border-color:var(--line);color:#fff;text-align:center;display:inline-block;min-width:0;padding:2px 14px}
.medal.m1{background:#f5b942;color:#3a2600;border-color:#f5b942}.medal.m2{background:#cfd6ea;color:#1d2540;border-color:#cfd6ea}.medal.m3{background:#d98a4a;color:#2e1800;border-color:#d98a4a}
.pl-row{padding:2px 4px}
/* sheet and dialogs */
.sheet{background:#0a0618}
.sheet-h,.sheet-f,.dlg,.panel,.bug,.gt,.seg,.hero-btn,.star,.slot-b,.pk,.chip{background-color:var(--surface)}
.bug{border-color:var(--line)}
.bug-t.w{background:linear-gradient(90deg,#5b2fd1,#3a1c94)}
.bug-t .badge{display:none}
.bug-t .bdg{width:40px;height:40px}
.gt.on,.seg button.on{background:linear-gradient(135deg,#8b5cf6,#5b21b6);color:#fff;border-color:#8b5cf6}
.seg button{color:var(--ink)}
.pk{border-color:var(--line);color:var(--ink)}
.pk.sel{background:var(--brand-soft);border-color:#8b5cf6}
.chip{border-color:var(--line)}
.overlay{background:rgba(4,2,12,.7)}
.star.on{background:var(--gold);border-color:var(--gold);color:#2a1a00}
#toast{background:#f3eeff;color:#140c2c}
.hero-btn{border-color:var(--line);color:var(--mute)}
.hero-btn.set{color:var(--ink)}
.po-join::before,.po-join::after,.po-join1::after{border-color:var(--line)}
.lead{border-radius:14px}


/* ---- design guide pass ---- */
.standcard td:nth-child(2){white-space:nowrap}.standcard .qual{vertical-align:middle}
:root{--bg:#100D24;--panelg:#191433;--bord:#6337A5;--ink2:#F7F3FF;--mute2:#C5BBDD;--c0:#38BDF8;--c1:#FB526B;--c2:#C56AFF}
body{background:radial-gradient(900px 500px at 78% -5%,rgba(139,92,246,.28),transparent 70%),radial-gradient(700px 500px at 0 100%,rgba(99,55,165,.28),transparent 70%),#100D24}
.bar{position:sticky;overflow:hidden}
.bar::after{content:"";position:absolute;right:0;top:0;bottom:0;width:420px;max-width:40%;background:var(--heroimg) right center/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%);opacity:.85;pointer-events:none;z-index:0}
.bar-in{position:relative;z-index:1}.sync{background:rgba(16,13,36,.78);border:1px solid rgba(99,55,165,.7);border-radius:999px;padding:4px 6px 4px 12px;backdrop-filter:blur(4px)}.slotrow .mgrid.one{grid-template-columns:minmax(0,1fr)}.hero{display:none!important}
main{max-width:1600px;margin-left:auto;margin-right:auto;padding-left:24px;padding-right:24px;box-sizing:border-box}
.mgrid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media(max-width:900px){.mgrid.three{grid-template-columns:1fr}}
.bk-grid{grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:20px}
@media(max-width:900px){.bk-grid{grid-template-columns:1fr}}
.bk-side{top:104px}
.mc-row.tc0:not(.win){background:linear-gradient(90deg,rgba(16,13,36,0) 35%,rgba(16,13,36,.0) 100%),linear-gradient(90deg,#16224f 0%,#12204a 55%,transparent 100%),var(--art0) right 44px center/auto 100% no-repeat}
.mc-row.tc1:not(.win){background:linear-gradient(90deg,#3a1226 0%,#3a1226 55%,transparent 100%),var(--art1) right 44px center/auto 100% no-repeat}
.mc-row.tc2:not(.win){background:linear-gradient(90deg,#2a1450 0%,#2a1450 55%,transparent 100%),var(--art2) right 44px center/auto 100% no-repeat}
.mc-row.win{box-shadow:inset 3px 0 0 #F5BC50}
.final-wrap{background-color:#191433;background-image:linear-gradient(90deg,#191433 0%,rgba(25,20,51,.7) 40%,rgba(25,20,51,0) 70%),var(--trophy) ;background-repeat:no-repeat;background-position:0 0,right center;background-size:100% 100%,auto 100%;border:1px solid var(--bord);min-height:230px}
.final-wrap .trophy{display:none}
.pl-card .laurel{font-size:0;color:transparent;width:92px;height:80px;border:0;border-radius:0;background:transparent center/contain no-repeat;mix-blend-mode:screen;flex:none}

/* ---- match drawer + teams (guide 2) ---- */
:root{--rGold:#F5C451;--rMid:#BC86FF;--rJungle:#35DDB0;--rEXP:#FF9560;--rRoam:#56D9FF;--panelg:#191433;--bord:#6337A5}
.role-Gold{--rc:var(--rGold)}.role-Mid{--rc:var(--rMid)}.role-Jungle{--rc:var(--rJungle)}.role-EXP{--rc:var(--rEXP)}.role-Roam{--rc:var(--rRoam)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}.btn .ic,.icon-btn .ic{width:18px;height:18px;flex:none}
.sheet{width:min(1560px,94vw);height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;border-left:1px solid var(--bord);background:#0f0b22}
.sheet-h{position:relative;flex:none;min-height:92px;padding:14px 24px;background:linear-gradient(90deg,#191433 0%,rgba(25,20,51,.92) 45%,rgba(25,20,51,.15) 100%),var(--heroimg) right center/auto 100% no-repeat,#191433;border-bottom:1px solid var(--bord)}
.sh-t{display:flex;align-items:center;gap:14px}.sh-t>.ic{width:40px;height:40px;color:#e6dcff}.sheet-h h2{font-size:28px;line-height:1.1}.sheet-h .sub{margin:2px 0 0;color:var(--mute2)}
.sheet-h .close{position:relative;z-index:1}
.bug{flex:none;margin:12px 24px 0}
.gtabs{flex:none;padding:14px 24px 0;display:flex;gap:10px;flex-wrap:wrap}
.gt{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:12px;border:1px solid var(--bord);background:rgba(99,55,165,.14);color:var(--ink2,#F7F3FF);transition:border-color .18s,box-shadow .18s,background .18s}
.gt .ic{width:26px;height:26px}.gt:hover{border-color:#A855F7}
.gt.on{background:linear-gradient(180deg,#7a3bd8,#5b27b0);border-color:#c79bff;box-shadow:0 0 18px rgba(168,85,247,.5)}
.gt span{font-weight:700}.gt small{display:block;font-weight:400}
.gbody{flex:1;min-height:0;overflow:auto;padding:14px 24px 18px}
.sheet-f{position:static;flex:none;padding:14px 24px;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,#191433,#120d2a);border-top:1px solid var(--bord)}
.sheet-f .acts.mid{margin-right:auto;margin-left:6px}
.btn.bad{border-color:#d4455c;color:#ff8fa0;background:rgba(212,69,92,.1)}.btn.bad:hover{background:rgba(212,69,92,.22)}
.seg{display:inline-flex;gap:0;border-radius:12px;border:1px solid var(--bord);overflow:hidden;background:rgba(25,20,51,.9);margin:0}
.seg button{display:inline-flex;align-items:center;gap:9px;padding:8px 20px;font-weight:700;border-right:1px solid var(--bord);transition:background .18s,box-shadow .18s}
.seg button .bdg{width:28px;height:28px}.seg button .ic{width:20px;height:20px}
.seg button.on{background:linear-gradient(180deg,#7a3bd8,#5b27b0);box-shadow:inset 0 0 0 2px #c79bff;color:#fff}
.two{position:relative;grid-template-columns:1fr 1fr;gap:34px;margin-top:12px}
.vs{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:2;font:italic 800 28px var(--display);color:#d9c3ff;text-shadow:0 0 14px #a855f7;pointer-events:none}
@media(max-width:1200px){.two{grid-template-columns:1fr;gap:14px}.vs{display:none}}
.panel{border:1px solid var(--bord);border-radius:16px;overflow:hidden;background:rgba(25,20,51,.85)}
.panel-h{display:flex;align-items:center;gap:12px;padding:10px 16px;min-height:64px;border-bottom:1px solid var(--bord)}
.panel-h .bdg{width:46px;height:46px;flex:none}.ph-n{min-width:0}.ph-n b{display:block;font:800 22px var(--display)}.ph-n small{color:var(--mute2)}
.panel-h .tot{margin-left:auto;color:#fff;font-size:14px;white-space:nowrap}
.tp0{border-color:#2f80d8}.tp0 .panel-h{background:linear-gradient(90deg,#10306a,#0f2a5c 60%,rgba(15,42,92,.1)),var(--art0) right center/auto 100% no-repeat,#0f1d45}
.tp1{border-color:#d4455c}.tp1 .panel-h{background:linear-gradient(90deg,#561428,#45101f 60%,rgba(69,16,31,.1)),var(--art1) right center/auto 100% no-repeat,#33101c}
.tp2{border-color:#9b5cf0}.tp2 .panel-h{background:linear-gradient(90deg,#3a1a72,#2d1459 60%,rgba(45,20,89,.1)),var(--art2) right center/auto 100% no-repeat,#241048}
.pr>*{min-width:0}.hero-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pr{grid-template-columns:minmax(80px,.8fr) minmax(104px,1.1fr) auto 36px auto;grid-template-areas:"who hero kda mvp items" "build build build build build";gap:6px 10px;padding:7px 14px;border-top:1px solid rgba(99,55,165,.5);box-shadow:inset 3px 0 0 var(--rc);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 14%,transparent),transparent 40%)}
.pr:first-of-type{border-top:0}
.ri{display:grid;place-items:center;width:30px;height:30px;color:var(--rc);flex:none}.ri .ic{width:24px;height:24px}
.who small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.who b{color:var(--rc);font-size:15px}.who small{color:var(--ink2,#F7F3FF);font-weight:500}
.hero-btn{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:38px;border:1px solid var(--bord);border-style:solid;background:rgba(16,13,36,.8);color:#d8cdf2}
.hero-btn .ic{width:16px;height:16px;transform:rotate(90deg);flex:none}.hero-btn.set{color:#fff}
.kd{display:inline-flex;align-items:center;gap:5px;background:rgba(16,13,36,.8);border:1px solid var(--bord);border-radius:8px;padding:0 4px 0 9px}
.kd span{color:var(--mute2);font-weight:700;font-size:13px}.kda{gap:5px}.kd{padding:0 2px 0 8px;gap:3px}.kd input{width:34px;border:0;background:transparent;text-align:center;padding:8px 2px;font-weight:700}
.kd:focus-within{border-color:#A855F7;box-shadow:0 0 0 2px rgba(168,85,247,.35)}
.star{display:grid;place-items:center;width:36px;height:36px;background:rgba(16,13,36,.8);border:1px solid var(--bord);color:#d8cdf2}
.star .ic{width:18px;height:18px}.star.on{background:#F5BC50;border-color:#F5BC50;color:#2b1a00}.star.on .ic{fill:currentColor}
.add-items{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid #3b82f6;border-style:solid;background:rgba(59,130,246,.14);color:#cfe3ff;border-radius:8px;padding:0 10px;min-height:38px;font-size:13px}
.tp1 ~ .x{}
.panel.tp1 .add-items{border-color:#ef5a73;background:rgba(239,90,115,.14);color:#ffd3da}.panel.tp2 .add-items{border-color:#b27cff;background:rgba(178,124,255,.14);color:#ecdcff}
.add-items .ic{width:16px;height:16px}
.pr .build{padding-left:40px}
@media(max-width:760px){.sheet{width:100vw}.pr{grid-template-columns:1fr 38px;grid-template-areas:"who mvp" "hero hero" "kda kda" "items items" "build build"}.gtabs,.gbody,.sheet-f,.sheet-h{padding-left:14px;padding-right:14px}.kda{flex-wrap:wrap}.sheet-f .acts{flex-wrap:wrap}.seg{flex-wrap:wrap}}
.tgrid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:1200px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.tgrid{grid-template-columns:1fr}}
.tcard{position:relative;overflow:hidden;padding:0 0 16px;border-radius:16px}
.tcard>*{position:relative;z-index:1}
.tcard::after{content:"";position:absolute;right:0;bottom:0;width:240px;height:120px;opacity:.4;pointer-events:none;z-index:0;-webkit-mask-image:linear-gradient(135deg,transparent 35%,#000);mask-image:linear-gradient(135deg,transparent 35%,#000);background-position:right bottom;background-size:cover}
.tcard.tp0::after{background-image:var(--art0)}.tcard.tp1::after{background-image:var(--art1)}.tcard.tp2::after{background-image:var(--art2)}
.tcard .team-h{margin:0 0 12px;padding:12px 14px;gap:10px;align-items:flex-end;border-bottom:1px solid var(--bord)}
.tcard .team-h .bdg{width:50px;height:50px;flex:none;align-self:center}.tcard .team-h .ord{align-self:center}
.th-f{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.th-f span,.nick-l>span:first-child{font-size:12px;color:var(--mute2)}
.th-f.sm{flex:none;width:72px}.th-b{display:flex;gap:6px}
.icon-btn{display:grid;place-items:center;min-width:36px;min-height:36px}.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.tcard>:not(.team-h){margin-left:14px;margin-right:14px}
.nick-l{display:block}.nk{display:flex;align-items:center;gap:8px;border:1px solid var(--bord);border-radius:8px;padding-left:10px;background:rgba(16,13,36,.8)}.nk .ic{width:16px;height:16px;color:var(--mute2)}.nk input{border:0;background:transparent;flex:1}
.plh,.tcard .pl{display:grid;grid-template-columns:96px minmax(0,1fr) minmax(0,1fr) 36px;gap:6px}
.plh{margin-top:12px;margin-bottom:4px;font-size:12px;color:var(--mute2)}
.tcard .pl{margin-bottom:7px}.tcard .pl select{border-left:4px solid var(--rc);font-weight:700;color:var(--rc)}
.tcard .btn.sm{margin-top:6px}
.sheet-h .close .ic{width:18px;height:18px}
@media(prefers-reduced-motion:reduce){.gt,.seg button{transition:none}}
html{background:#100D24}body{min-height:100vh;background-attachment:fixed}
.tcard.tp0 .team-h{background:linear-gradient(90deg,#10306a,#0f2a5c 60%,rgba(15,42,92,.2))}
.tcard.tp1 .team-h{background:linear-gradient(90deg,#561428,#45101f 60%,rgba(69,16,31,.2))}
.tcard.tp2 .team-h{background:linear-gradient(90deg,#3a1a72,#2d1459 60%,rgba(45,20,89,.2))}
.nk input{padding-top:8px;padding-bottom:8px}

function setStatus(){
  const el=$('sync');if(!el)return;
  let dot='',txt='';
  if(ONLINE===false){dot='off';txt=EDIT?'Offline, saved on this device':'Offline'}
  else if(ONLINE===null){dot='warn';txt='Connecting'}
  else if(EDIT){dot=SAVED?'live':'warn';txt=SAVED?'Editing, saved online':'Saving'}
  else{dot='live';txt='Live view'}
  el.innerHTML=`<span><span class="dot ${dot}"></span>${txt}</span>`+(EDIT?'<button onclick="signOut()">'+ic('signout')+' Sign out</button>':'<button onclick="openAuth()">'+ic('settings')+' Edit with passcode</button>');
  document.body.classList.toggle('viewer',!EDIT);
}
function adopt(row){
  adopting=true;
  S=Object.assign(defaultState(),row.data);VER=row.version;
  try{render()}finally{adopting=false}
  lastJ=JSON.stringify(S);
  try{localStorage.setItem(KEY,lastJ)}catch(e){}
}
function busy(){const a=document.activeElement;return !!(W||P||(a&&['INPUT','SELECT','TEXTAREA'].includes(a.tagName)&&$('app').contains(a)))}
async function pull(first){
  try{
    const rows=await api('/rest/v1/mlbb_state?id=eq.main&select=data,version');
    ONLINE=true;
    const row=rows[0];if(!row)throw new Error('no row');
    if(row.version!==VER||first){
      if(row.data){
        if(first||(!pushing&&SAVED&&!busy()))adopt(row);
      }else if(EDIT&&S.teams.length){VER=row.version;lastJ='';schedulePush(true)}
      else VER=row.version;
    }else if(EDIT&&!SAVED&&!pushing)schedulePush(true);
  }catch(e){ONLINE=false}
  setStatus();
}
function schedulePush(now){SAVED=false;setStatus();clearTimeout(pushTimer);pushTimer=setTimeout(doPush,now?0:700)}
async function doPush(){
  if(!EDIT||pushing)return;

/* ---------- helpers ---------- */
const teamById=id=>S.teams.find(t=>t.id===id);
const pname=p=>p.name||('('+p.role+')');
const seedOf=id=>S.teams.findIndex(t=>t.id===id)+1;
function playerById(pid){for(const t of S.teams){const p=t.players.find(x=>x.id===pid);if(p)return {p,team:t}}return null}
function fmtMode(){const n=S.teams.length;if(S.format==='elim')return 'elim';if(S.format==='rr')return n>=3?'rr':'elim';return n>=4?'groups':'elim'}
function useGroups(){return fmtMode()==='groups'}
function tagOf(id){return useGroups()?(S.grp[id]||''):String(seedOf(id))}
function seedOrder(size){let o=[1];while(o.length<size){const n=o.length*2+1;o=o.flatMap(x=>[x,n-x])}return o}
function needFor(bo){return Math.floor(bo/2)+1}

/* a series is a list of games; games after a decided series are ignored */
function series(games,need){
  let sa=0,sb=0,decided=false,played=0;
  for(const g of games){
    if(decided)break;
    if(g.win==='a')sa++;else if(g.win==='b')sb++;else break;
    played++;
    if(sa>=need||sb>=need)decided=true;
  }
  return {sa,sb,decided,played};
}

/* ---------- bracket engine ---------- */
function mk(id,a,b,label,bo){return {id,a,b,label,bo,need:needFor(bo),bye:false,winner:null,rec:null,ff:'',sa:0,sb:0,num:0,la:'',lb:''}}
function resolve(m){
  if(m.a&&m.b){
    let rec=S.matches[m.id];
    if(rec&&(rec.ta!==m.a||rec.tb!==m.b||!Array.isArray(rec.games))){delete S.matches[m.id];rec=null}
    m.rec=rec||null;
    if(rec){
      const s=series(rec.games,m.need);
      m.sa=s.sa;m.sb=s.sb;
      if(rec.ff==='both'){m.ff='both';m.sa=m.sb=0}
      else if(rec.ff==='a'||rec.ff==='b'){m.ff=rec.ff;m.sa=m.sb=0;m.winner=rec.ff==='a'?m.b:m.a}
      else if(s.decided)m.winner=s.sa>s.sb?m.a:m.b;
    }
  }else if(S.matches[m.id])delete S.matches[m.id];
}
function build(){const m=fmtMode();return m==='groups'?buildGroups():m==='rr'?buildRR():buildElim()}

function buildElim(){
  const n=S.teams.length;
  if(n<2)return {mode:'elim',rounds:[],all:[],champ:null};
  let size=1,total=0;while(size<n){size*=2;total++}
  let cur=seedOrder(size).map(s=>s<=n?S.teams[s-1].id:null);
  const rounds=[],all=[];
  for(let r=0;r<total;r++){
    const bo=S.bo[r]!=null?S.bo[r]:(r>=total-2?3:1);
    const name=r===total-1?'Final':r===total-2?'Semifinals':r===total-3?'Quarterfinals':'Round '+(r+1);
    const ms=[],next=[];
    for(let i=0;i<cur.length;i+=2){
      const a=cur[i],b=cur[i+1];
      const m=mk('r'+r+'m'+(i/2),a,b,name,bo);m.r=r;
      if(r===0&&(!a||!b)){m.bye=true;m.winner=a||b}else resolve(m);
      next.push(m.winner);ms.push(m);if(!m.bye)all.push(m);
    }
    rounds.push({r,name,bo,ms});cur=next;
  }
  let k=1;all.forEach(m=>{m.num=k++});
  return {mode:'elim',rounds,all,champ:cur[0]||null};
}

function ensureGroups(){
  S.grp=S.grp||{};
  const ids=new Set(S.teams.map(t=>t.id));
  Object.keys(S.grp).forEach(k=>{if(!ids.has(k))delete S.grp[k]});
  let a=0,b=0;
  S.teams.forEach(t=>{if(S.grp[t.id]==='A')a++;else if(S.grp[t.id]==='B')b++});
  S.teams.forEach(t=>{
    if(S.grp[t.id]!=='A'&&S.grp[t.id]!=='B'){if(a<=b){S.grp[t.id]='A';a++}else{S.grp[t.id]='B';b++}}
  });
}
function rrRounds(ids){
  /* match 1 is always team 1 vs team 2, following the team list order */
  if(ids.length===3)return [[[ids[0],ids[1]]],[[ids[1],ids[2]]],[[ids[2],ids[0]]]];
  const odd=ids.length%2===1;
  const t=ids.length<2?[...ids]:[ids[0],...ids.slice(2),...(odd?[null]:[]),ids[1]];
  const m=t.length,rounds=[];
  for(let r=0;r<m-1;r++){
    const pairs=[];
    for(let i=0;i<m/2;i++){const x=t[i],y=t[m-1-i];if(x&&y)pairs.push([x,y])}
    rounds.push(pairs);
    t.splice(1,0,t.pop());
  }
  return rounds;
}
function groupTable(Gg){
  const row={},beat={};
  const gf={};
  Gg.ids.forEach(id=>{row[id]={id,p:0,w:0,l:0,gw:0,gl:0,hh:0,gd:0,tb:(S.tb&&S.tb[id])||0,tied:false};beat[id]={};gf[id]={}});
  Gg.matches.forEach(m=>{
    if(!m.winner)return;
    const lo=m.winner===m.a?m.b:m.a;
    row[m.winner].w++;row[lo].l++;row[m.a].p++;row[m.b].p++;
    row[m.a].gw+=m.sa;row[m.a].gl+=m.sb;row[m.b].gw+=m.sb;row[m.b].gl+=m.sa;
    gf[m.a][m.b]=(gf[m.a][m.b]||0)+m.sa;gf[m.b][m.a]=(gf[m.b][m.a]||0)+m.sb;
    beat[m.winner][lo]=1;
  });
  const arr=Object.values(row);
  /* tie-break order from the Siglakas rules: wins, then head-to-head, then game differential among the tied teams, then a do-or-die game */
  arr.forEach(r=>{
    const same=arr.filter(o=>o!==r&&o.w===r.w);
    r.hh=same.filter(o=>beat[r.id][o.id]).length;
    r.gd=same.reduce((s,o)=>s+(gf[r.id][o.id]||0)-(gf[o.id][r.id]||0),0);
  });
  arr.sort((x,y)=>y.w-x.w||y.hh-x.hh||y.gd-x.gd||y.tb-x.tb||seedOf(x.id)-seedOf(y.id));
  arr.forEach(r=>{r.tied=arr.some(o=>o!==r&&o.w===r.w&&o.hh===r.hh&&o.gd===r.gd&&o.tb===r.tb)});
  return arr;
}
function tbAdj(id,d){S.tb=S.tb||{};S.tb[id]=(S.tb[id]||0)+d;render()}

function buildRR(){
  const ids=S.teams.map(t=>t.id),rounds=rrRounds(ids),gbo=S.bo.group!=null?S.bo.group:1,fbo=S.bo.final!=null?S.bo.final:3;
  const G={A:{g:'A',ids,rounds,matches:[]}};
  const out={mode:'rr',G,slots:[],sf:[],fin:null,champ:null,all:[],nSlots:rounds.length,invalid:false};
  let num=1;
  rounds.forEach((pairs,s)=>{
    const sl=[];
    pairs.forEach((p,i)=>{
      const m=mk('gAr'+s+'m'+i,p[0],p[1],'Round '+(s+1),gbo);
      m.num=num++;m.grp='A';resolve(m);G.A.matches.push(m);sl.push(m);out.all.push(m);
    });
    out.slots.push(sl);
  });
  G.A.table=groupTable(G.A);
  G.A.done=G.A.matches.length>0&&G.A.matches.every(m=>m.winner||m.ff==='both');
  const T=G.A.table,done=G.A.done,top=new Set(done?[T[0].id,T[1].id]:[]),used=new Set();
  const pick=i=>{const id=T[i].id,rp=S.rep&&S.rep['A'+(i+1)];
    if(done&&rp&&teamById(rp)&&!top.has(rp)&&!used.has(rp)){used.add(rp);return rp}return id};
  const fin=mk('pF',done?pick(0):null,done?pick(1):null,'Final',fbo);
  fin.la='Round robin, 1st';fin.lb='Round robin, 2nd';
  resolve(fin);fin.num=num++;
  out.fin=fin;out.champ=fin.winner;out.all.push(fin);
  return out;
}
function buildGroups(){
  ensureGroups();
  const gbo=S.bo.group!=null?S.bo.group:1;
  const G={};
  ['A','B'].forEach(g=>{const ids=S.teams.filter(t=>S.grp[t.id]===g).map(t=>t.id);G[g]={g,ids,rounds:rrRounds(ids),matches:[]}});
  const out={mode:'groups',G,slots:[],sf:[],fin:null,champ:null,all:[],nSlots:0,invalid:G.A.ids.length<2||G.B.ids.length<2};
  if(out.invalid)return out;
  const nSlots=Math.max(G.A.rounds.length,G.B.rounds.length);out.nSlots=nSlots;
  let num=1;
  for(let s=0;s<nSlots;s++){
    const sl=[];
    ['A','B'].forEach(g=>(G[g].rounds[s]||[]).forEach((p,i)=>{
      const m=mk('g'+g+'r'+s+'m'+i,p[0],p[1],'Group '+g+', round '+(s+1),gbo);
      m.num=num++;m.grp=g;resolve(m);G[g].matches.push(m);sl.push(m);out.all.push(m);
    }));
    out.slots.push(sl);
  }
  ['A','B'].forEach(g=>{G[g].table=groupTable(G[g]);G[g].done=G[g].matches.length>0&&G[g].matches.every(m=>m.winner||m.ff==='both')});
  const both=G.A.done&&G.B.done,A=G.A.table,B=G.B.table;
  const sbo=S.bo.sf!=null?S.bo.sf:1,fbo=S.bo.final!=null?S.bo.final:3;
  const topIds=new Set(both?[A[0].id,A[1].id,B[0].id,B[1].id]:[]),used=new Set();
  const pick=(G2,i)=>{const id=G[G2].table[i].id,rp=S.rep&&S.rep[G2+(i+1)];
    if(both&&rp&&teamById(rp)&&!topIds.has(rp)&&!used.has(rp)){used.add(rp);return rp}return id};
  const q={A1:both?pick('A',0):null,A2:both?pick('A',1):null,B1:both?pick('B',0):null,B2:both?pick('B',1):null};
  out.q=q;
  const sf1=mk('pSF1',q.A1,q.B2,'Semifinal 1',sbo);sf1.la='Group A, 1st';sf1.lb='Group B, 2nd';
  const sf2=mk('pSF2',q.B1,q.A2,'Semifinal 2',sbo);sf2.la='Group B, 1st';sf2.lb='Group A, 2nd';
  resolve(sf1);resolve(sf2);
  const fin=mk('pF',sf1.winner,sf2.winner,'Final',fbo);fin.la='Winner of semifinal 1';fin.lb='Winner of semifinal 2';resolve(fin);
  delete S.matches.pT;
  sf1.num=num++;sf2.num=num++;fin.num=num++;
  out.sf=[sf1,sf2];out.fin=fin;out.champ=fin.winner;
  out.all.push(sf1,sf2,fin);
  return out;
}

/* ---------- stats ---------- */
function gameMvps(m,g){
  if(!g.win)return {w:'',l:''};
  const w=g.win==='a'?g.mvpA:g.mvpB,l=g.win==='a'?g.mvpB:g.mvpA;
  return {w:w||'',l:l||''};
}
function playerStats(stage){
  const map={};
  S.teams.forEach(t=>t.players.forEach(p=>{map[p.id]={p,team:t,g:0,k:0,d:0,a:0,mvp:0,lmvp:0,heroes:{}}}));
  build().all.forEach(m=>{
    if(!m.rec)return;
    if(stage==='group'&&!m.grp)return;
    if(stage==='playoff'&&m.grp)return;
    m.rec.games.forEach(g=>{
      for(const pid in (g.stats||{})){
        const s=g.stats[pid],x=map[pid];if(!x)continue;
        x.g++;x.k+=s.k||0;x.d+=s.d||0;x.a+=s.a||0;
        const h=canonHero(s.hero);if(h)x.heroes[h]=(x.heroes[h]||0)+1;
      }
      const mv=gameMvps(m,g);
      if(mv.w&&map[mv.w])map[mv.w].mvp++;
      if(mv.l&&map[mv.l])map[mv.l].lmvp++;
    });
  });
  Object.values(map).forEach(x=>{
    x.kda=(x.k+x.a)/Math.max(x.d,1);x.avgk=x.g?x.k/x.g:0;
    const e=Object.entries(x.heroes).sort((a,b)=>b[1]-a[1])[0];x.mainHero=e?e[0]:'';
  });
  return Object.values(map);
}
function analysisData(){
  const heroes={},items={},roleH={},teams={};
  S.teams.forEach(t=>{teams[t.id]={t,m:0,w:0,gp:0,gw:0,k:0,d:0,a:0,mvp:0,heroes:{}}});
  let games=0;
  build().all.forEach(m=>{
    if(!m.rec||!m.a||!m.b)return;
    if(m.winner){const A=teams[m.a],B=teams[m.b];if(A&&B){A.m++;B.m++;(m.winner===m.a?A:B).w++}}
    m.rec.games.forEach(g=>{
      if(!g.win)return;
      games++;
      [['a',m.a],['b',m.b]].forEach(([side,id])=>{
        const T=teams[id];if(!T)return;
        const won=g.win===side;T.gp++;if(won)T.gw++;
        const mv=side==='a'?g.mvpA:g.mvpB;if(won&&mv)T.mvp++;
        teamById(id).players.forEach(p=>{
          const s=(g.stats||{})[p.id];if(!s)return;
          T.k+=s.k||0;T.d+=s.d||0;T.a+=s.a||0;
          const hn=canonHero(s.hero);
          if(hn){
            const H=heroes[hn]=heroes[hn]||{name:hn,picks:0,wins:0,k:0,d:0,a:0,roles:{}};
            H.picks++;if(won)H.wins++;H.k+=s.k||0;H.d+=s.d||0;H.a+=s.a||0;
            H.roles[p.role]=(H.roles[p.role]||0)+1;
            T.heroes[hn]=(T.heroes[hn]||0)+1;
            const R=roleH[p.role]=roleH[p.role]||{};
            const RH=R[hn]=R[hn]||{picks:0,wins:0};RH.picks++;if(won)RH.wins++;
          }
          (s.items||[]).forEach(it=>{
            const n=canonItem(it);if(!n)return;
            const I=items[n]=items[n]||{name:n,n:0,w:0};I.n++;if(won)I.w++;
          });
        });
      });
    });
  });
  return {heroes:Object.values(heroes),items:Object.values(items),roleH,teams:Object.values(teams),games};
}
let PG={};
function pg(key,arr,def){
  const s=PG[key]=PG[key]||{p:1,n:def||10};
  const pages=Math.max(1,Math.ceil(arr.length/s.n));
  if(s.p>pages)s.p=pages;
  const st=(s.p-1)*s.n,rows=arr.slice(st,st+s.n);
  let html='';
  if(arr.length>5){
    const nums=[];
    for(let i=1;i<=pages;i++)if(i===1||i===pages||Math.abs(i-s.p)<=1)nums.push(i);
    const btns=[];let prev=0;
    nums.forEach(i=>{if(prev&&i-prev>1)btns.push('<span class="mute">...</span>');btns.push(`<button class="${i===s.p?'on':''}" ${i===s.p?'aria-current="page"':''} onclick="setPage('${key}',${i})">${i}</button>`);prev=i});
    html=`<div class="pager"><span class="mute">Showing ${st+1} to ${st+rows.length} of ${arr.length}</span><div class="pgs"><button ${s.p<=1?'disabled':''} onclick="setPage('${key}',${s.p-1})">Previous</button>${btns.join('')}<button ${s.p>=pages?'disabled':''} onclick="setPage('${key}',${s.p+1})">Next</button></div><label class="mute">Rows <select class="keep" aria-label="Rows per page" onchange="setSize('${key}',this.value)">${[5,8,10,25,50].filter((n,i,a)=>n===s.n||[5,10,25,50].includes(n)).map(n=>`<option ${n===s.n?'selected':''}>${n}</option>`).join('')}</select></label></div>`;
  }
  return {rows,st,html};
}
function setPage(k,p){PG[k].p=p;render()}
function setSize(k,n){PG[k].n=parseInt(n);PG[k].p=1;render()}
function mvpRace(stage){
  return playerStats(stage).filter(x=>x.g>0).sort((a,b)=>b.mvp-a.mvp||b.kda-a.kda||b.k-a.k);
}
function mvpTable(list,title,note){
  if(!list.length)return `<div class="card"><h4 class="ct">${title}</h4><p class="mute" style="margin:0">${note}</p></div>`;
  const P=pg('mvp'+title,list,5),top=P.rows;
  return `<div class="card"><h4 class="ct">${title}</h4><div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Player</th><th>Team</th><th class="n">Games</th><th class="n">Win MVP</th><th class="n">Lose MVP</th><th class="n">KDA</th></tr></thead><tbody>
  ${top.map((x,i)=>`<tr class="${P.st+i===0?'adv':''} role-${x.p.role}"><td class="rk">${P.st+i+1}</td><td><b>${esc(pname(x.p))}</b>${x.p.ign?` <span class="mute">${esc(x.p.ign)}</span>`:''}<br><span class="rtxt">${x.p.role}</span></td><td>${esc(x.team.name)}</td><td class="n">${x.g}</td><td class="n"><b>${x.mvp}</b></td><td class="n">${x.lmvp}</td><td class="n">${x.kda.toFixed(2)}</td></tr>`).join('')}
  </tbody></table></div>${P.html}<p class="note">Ranked by winning MVPs, then KDA. Kills alone never decide it.</p></div>`;
}
function mvpSection(b){
  let h='<section class="sec"><h3>MVP race</h3><div class="two-col">';
  if(b.mode==='groups'||b.mode==='rr')h+=mvpTable(mvpRace('group'),b.mode==='rr'?'Round robin MVP':'Group stage MVP','No group stage games with stats yet.');
  if(b.mode!=='rr')h+=mvpTable(mvpRace(b.mode==='groups'?'playoff':null),b.mode==='groups'?'Playoffs MVP':'Tournament MVP','No playoff games with stats yet.');
  h+='</div>';
  const fin=b.fin?b.fin:(b.rounds.length?b.rounds[b.rounds.length-1].ms[0]:null);
  const fm=fin&&finalMvp(fin);
  if(fm){
    let g=0,k=0,d=0,a=0,mv=0;const hs=[];
    fin.rec.games.forEach((gm,i)=>{const s=(gm.stats||{})[fm.p.id];if(s){g++;k+=s.k||0;d+=s.d||0;a+=s.a||0;if(s.hero)hs.push(s.hero)}
      if(gm.win&&(gm.win==='a'?gm.mvpA:gm.mvpB)===fm.p.id)mv++});
    h+=`<div class="card" style="margin-top:14px"><h4 class="ct">Finals MVP</h4><div class="lead role-${fm.p.role}" style="border:0;padding:0"><span class="rd"></span><div><b>${esc(pname(fm.p))}${fm.p.ign?` <span class="mute" style="font-weight:400">${esc(fm.p.ign)}</span>`:''}</b><span>${esc(fm.team.name)}, ${fm.p.role}. ${mv} winning MVP${mv===1?'':'s'} in the final, ${k}/${d}/${a} over ${g} game${g===1?'':'s'}${hs.length?', heroes: '+[...new Set(hs)].map(esc).join(', '):''}</span></div></div></div>`;
  }
  return h+'</section>';
}
function teamStandings(){
  const st={};S.teams.forEach(t=>st[t.id]={t,mw:0,ml:0,gw:0,gl:0,k:0,d:0,a:0});
  build().all.forEach(m=>{
    if(!m.rec||!m.a||!m.b)return;
    const A=st[m.a],B=st[m.b];if(!A||!B)return;
    A.gw+=m.sa;A.gl+=m.sb;B.gw+=m.sb;B.gl+=m.sa;
    if(m.winner===m.a){A.mw++;B.ml++}else if(m.winner===m.b){B.mw++;A.ml++}
  });
  playerStats().forEach(x=>{const s=st[x.team.id];if(s){s.k+=x.k;s.d+=x.d;s.a+=x.a}});
  return Object.values(st).sort((a,b)=>b.mw-a.mw||(b.gw-b.gl)-(a.gw-a.gl)||b.gw-a.gw);
}
function finalMvp(m){
  if(!m||!m.winner||!m.rec)return null;
  const side=m.winner===m.a?'a':'b',cnt={};let last='';
  m.rec.games.forEach(g=>{if(g.win===side){const id=side==='a'?g.mvpA:g.mvpB;if(id){cnt[id]=(cnt[id]||0)+1;last=id}}});
  let best='',bn=0;
  for(const id in cnt){if(cnt[id]>bn||(cnt[id]===bn&&id===last)){best=id;bn=cnt[id]}}
  return best?playerById(best):null;
}

  const f=(x,l,full)=>`<label class="kd"><span aria-hidden="true">${l}</span><input type="number" min="0" step="1" inputmode="numeric" placeholder="0" aria-label="${full} of ${nm}" value="${s[x]===''||s[x]==null?'':s[x]}" oninput="setStat(${i},'${p.id}','${x}',this.value)"></label>`;
  return `<div class="pr role-${p.role}">
    <div class="who"><span class="ri">${ic('r-'+p.role)}</span><div><b>${p.role}</b><small>${p.name?nm:'<span class="mute">No name yet</span>'}${p.ign?`<span class="mute" style="font-weight:400">, ${esc(p.ign)}</span>`:''}</small></div></div>
    <button class="hero-btn ${s.hero?'set':''}" aria-label="Hero of ${nm}: ${s.hero?esc(s.hero):'not chosen'}" onclick="pickHero(${i},'${p.id}')"><span>${s.hero?esc(s.hero):'Choose hero'}</span>${ic('chev')}</button>
    <div class="kda">${f('k','K','Kills')}${f('d','D','Deaths')}${f('a','A','Assists')}</div>
    <button class="star ${g[mvpKey]===p.id?'on':''}" title="MVP of this team" aria-label="MVP of this team: ${nm}" aria-pressed="${g[mvpKey]===p.id}" onclick="setMvp(${i},'${side}','${p.id}')">${ic('star')}</button>
    <button class="add-items" aria-label="${its.length?'Edit':'Add'} items for ${nm}" onclick="pickItems(${i},'${p.id}')">${ic('cart')}<span>${its.length?'Items ('+its.length+')':'Items'}</span></button>
    ${its.length?`<div class="build">${chipsHtml(its)}</div>`:''}
  </div>`;
}
function gameBody(i){
  const g=gameAt(i),m=W.m,A=teamById(m.a),B=teamById(m.b);
  const panel=(t,side)=>`<div class="panel tp${tcT(t)}"><div class="panel-h">${badge(t)}<div class="ph-n"><b>${esc(t.name)}</b>${t.nick?`<small>${esc(t.nick)}</small>`:''}</div><span class="tot" id="tot-${side}">${totalsText(g,t)}</span></div>${t.players.map(p=>playerRow(p,side,i,g)).join('')}</div>`;
  const wb=(v,label,icon)=>{const on=(g.win||'')===v;return `<button class="${on?'on':''}" aria-pressed="${on}" onclick="setWin(${i},'${v}')">${icon}<span>${label}</span>${on?ic('check'):''}</button>`};
  return `<div class="acts" style="justify-content:space-between;margin-bottom:4px">
      <div class="seg" role="group" aria-label="Winner of game ${i+1}">
        ${wb('a',esc(A.name)+' won',badge(A))}
        ${wb('b',esc(B.name)+' won',badge(B))}
        ${wb('',"Not decided",ic('help'))}
      </div>
      ${i>0?`<button class="btn ghost sm" onclick="copyPrev(${i})">${ic('list')} Copy heroes and items from game ${i}</button>`:''}
    </div>
    <div class="two">${panel(A,'a')}<span class="vs" aria-hidden="true">VS</span>${panel(B,'b')}</div>
    <p class="note">Tap the star to mark each team's MVP. The MVP of the winning team counts as the winning MVP, the other as the losing MVP. Leave a player empty if they did not play this game.</p>`;
}
function summaryBody(){
  const m=W.m,A=teamById(m.a),B=teamById(m.b);
  const played=W.games.map((g,i)=>({g,i})).filter(x=>x.g.win);
  if(!played.length)return `<p class="empty">No games recorded yet. Open Game 1 to choose the winner and enter player stats.</p>`;
  const who=(pid,g)=>{if(!pid)return '<span class="mute">None</span>';const x=playerById(pid);if(!x)return '';const h=(g.stats[pid]||{}).hero;return `${esc(pname(x.p))}${h?` <span class="mute">on ${esc(h)}</span>`:''}`};
  const games=`<div class="card" style="margin-bottom:14px"><h4 class="ct">Games</h4><div class="tblwrap"><table class="tbl"><thead><tr><th>Game</th><th>Winner</th><th>Winning MVP</th><th>Losing MVP</th><th></th></tr></thead><tbody>
    ${played.map(({g,i})=>{const mv=gameMvps(m,g);return `<tr><td><b>Game ${i+1}</b></td><td>${esc(g.win==='a'?A.name:B.name)}</td><td>${who(mv.w,g)}</td><td>${who(mv.l,g)}</td><td class="n"><button class="btn ghost sm" onclick="setTab(${i})">Open</button></td></tr>`}).join('')}
    </tbody></table></div></div>`;
  const team=t=>{
    return `<div class="card"><h4 class="ct">${esc(t.name)}</h4><div class="tblwrap"><table class="tbl"><thead><tr><th>Player</th><th>Heroes by game</th><th class="n">K</th><th class="n">D</th><th class="n">A</th><th class="n">KDA</th></tr></thead><tbody>
    ${t.players.map(p=>{
      let k=0,d=0,a=0,any=false;const hs=[];
      played.forEach(({g,i})=>{const s=g.stats[p.id];if(s){any=true;k+=s.k||0;d+=s.d||0;a+=s.a||0;if(s.hero)hs.push(`G${i+1} ${esc(s.hero)}`)}});
      if(!any)return '';
      return `<tr class="role-${p.role}"><td><span class="rd"></span> ${esc(pname(p))} <span class="rtxt">${p.role}</span></td><td>${hs.join(', ')||'<span class="mute">-</span>'}</td><td class="n">${k}</td><td class="n">${d}</td><td class="n">${a}</td><td class="n">${((k+a)/Math.max(d,1)).toFixed(2)}</td></tr>`;
    }).join('')||'<tr><td colspan="6" class="mute">No player stats entered.</td></tr>'}
    </tbody></table></div></div>`;
  };
  return games+`<div class="two">${team(A)}${team(B)}</div>`;
}
function ffBody(){
  const m=W.m;
  if(W.ff==='both')return `<div class="card empty-card"><h3>Both teams forfeit</h3><p>Neither team played, so this match has no winner and counts as finished. No stats are recorded. If this decides a group, the standings place both teams below the teams that played.</p></div>`;
  const lo=teamById(W.ff==='a'?m.a:m.b),wi=teamById(W.ff==='a'?m.b:m.a);
  return `<div class="card empty-card"><h3>${esc(lo.name)} forfeits</h3><p>${esc(wi.name)} wins this match and advances. No player stats are recorded, and a forfeit does not count toward rankings or analysis.</p></div>`;
}
function setFF(v){W.ff=v;W.dirty=true;rerender()}
function setWin(i,v){gameAt(i).win=v;W.dirty=true;rerender()}
function setStat(i,pid,f,v){
  const s=statAt(gameAt(i),pid);
  s[f]=v===''?'':Math.max(0,parseInt(v)||0);
  W.dirty=true;updateTotals(i);
}
function setMvp(i,side,pid){
  const g=gameAt(i),key=side==='a'?'mvpA':'mvpB';
  g[key]=g[key]===pid?'':pid;W.dirty=true;rerender();
}
function copyPrev(i){
  const prev=W.games[i-1],g=gameAt(i);if(!prev)return;
  let n=0;
  [...teamById(W.m.a).players,...teamById(W.m.b).players].forEach(p=>{
    const ps=prev.stats[p.id];if(!ps||(!ps.hero&&!(ps.items||[]).length))return;
    const s=statAt(g,p.id);s.hero=ps.hero||'';s.items=[...(ps.items||[])];n++;
  });
  W.dirty=true;rerender();toast(n?'Copied from game '+i:'Nothing to copy from game '+i);
}
function closeSheet(force){
  if(!force&&W&&W.dirty&&!confirm('Discard your unsaved changes?'))return;
  const rid=W&&W.id;W=null;$('sheetwrap').classList.remove('open','fresh');$('sheetwrap').innerHTML='';
  closePicker(true);if(rid)restoreFocus(rid);
}
function clearSheet(){
  if(!EDIT)return;
  if(!confirm('Clear the whole result of this match? Later matches that depend on it are cleared too.'))return;
  const rid=W.id;delete S.matches[W.id];W=null;
  $('sheetwrap').classList.remove('open');$('sheetwrap').innerHTML='';
  render();toast('Result cleared');restoreFocus(rid);
}
function saveSheet(){
  if(!EDIT)return;
  const m=W.m,keep=[];let sa=0,sb=0;
  if(W.ff){S.matches[W.id]={ta:m.a,tb:m.b,sa:0,sb:0,games:[],ff:W.ff};const rid=W.id;closeSheet(true);render();toast('Forfeit saved');restoreFocus(rid);return}
  const validMvp=(id,team)=>team.players.some(p=>p.id===id)?id:'';
  const clean=g=>{
    const stats={};
    Object.keys(g.stats).forEach(pid=>{
      const s=g.stats[pid];
      const items=(s.items||[]).map(canonItem).filter(Boolean),hero=canonHero(s.hero);
      if(s.k===''&&s.d===''&&s.a===''&&!hero&&!items.length)return;
      stats[pid]={k:+s.k||0,d:+s.d||0,a:+s.a||0,hero,items};
    });
    return {win:g.win,stats,mvpA:validMvp(g.mvpA,teamById(m.a)),mvpB:validMvp(g.mvpB,teamById(m.b))};
  };
  for(const g of W.games){
    const c=clean(g);
    if(!c.win){if(Object.keys(c.stats).length||c.mvpA||c.mvpB)keep.push(c);break}
    keep.push(c);
    if(c.win==='a')sa++;else sb++;
    if(sa>=m.need||sb>=m.need)break;
  }
  if(!keep.length)delete S.matches[W.id];
  else S.matches[W.id]={ta:m.a,tb:m.b,sa,sb,games:keep};
  const rid=W.id;closeSheet(true);render();toast('Result saved');restoreFocus(rid);
}

/* ---------- hero and item picker ---------- */
let P=null;
function pickHero(gi,pid){P={kind:'hero',gi,pid,q:'',cat:'All',list:[]};renderPicker()}
function pickItems(gi,pid){P={kind:'items',gi,pid,q:'',cat:'All',list:[]};renderPicker()}
function renderPicker(){
  const pl=playerById(P.pid).p,hero=P.kind==='hero';
  const title=hero?'Choose a hero for '+pname(pl):'Build for '+pname(pl);
  $('picker').innerHTML=`<div class="dlg" role="dialog" aria-label="${esc(title)}">
    <div class="dlg-h"><h3>${esc(title)}</h3><button class="btn ghost sm" onclick="closePicker()">${hero?'Close':'Done'}</button></div>
    ${hero?'':'<div class="slots" id="pk-slots"></div>'}
    <div class="dlg-s"><input id="pk-q" type="search" autocomplete="off" placeholder="${hero?'Search a hero, or type a new name and press Enter':'Search an item, or type a new name and press Enter'}" aria-label="Search" oninput="pkQuery(this.value)" onkeydown="pkKey(event)"></div>
    ${hero?'':'<div class="pills" id="pk-cats"></div>'}
    <div class="pk-grid" id="pk-grid"></div></div>`;
  $('picker').classList.add('open');
  pkDraw();$('pk-q').focus();
}
function curStat(){return statAt(gameAt(P.gi),P.pid)}
function pkDraw(){
  const q=P.q.trim().toLowerCase(),s=curStat();
  if(P.kind==='items'){
    const sl=[];
    for(let i=0;i<6;i++){const it=s.items[i];sl.push(it?`<div class="slot-b f"><span>${esc(it)}</span><button aria-label="Remove ${esc(it)}" onclick="pkRemove(${i})">×</button></div>`:`<div class="slot-b">Slot ${i+1}</div>`)}
    $('pk-slots').innerHTML=sl.join('');
    $('pk-cats').innerHTML=['All',...Object.keys(ITEM_CATS)].map(c=>`<button class="${P.cat===c?'on':''}" onclick="pkCat(this.dataset.c)" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  }
  let base=P.kind==='hero'?HEROES:(P.cat==='All'?ITEMS:ITEM_CATS[P.cat]);
  let list=q?base.filter(x=>x.toLowerCase().includes(q)):base;
  P.list=list;
  const exact=q&&base.some(x=>x.toLowerCase()===q);
  const chosen=P.kind==='hero'?s.hero:'';
  let h='';
  if(q&&!exact)h+=`<button class="pk custom" onclick="pkCustom()">Use "${esc(P.q.trim())}"</button>`;
  h+=list.map((x,i)=>{
    const sel=P.kind==='hero'?x===chosen:s.items.includes(x);
    const ord=P.kind==='items'&&sel?`${s.items.indexOf(x)+1}. `:'';
    return `<button class="pk ${sel?'sel':''}" onclick="pkPick(${i})">${ord}${esc(x)}</button>`;
  }).join('');
  if(!h)h='<p class="empty">Nothing matches. Type the full name and press Enter to add it.</p>';
  $('pk-grid').innerHTML=h;
}
function pkQuery(v){P.q=v;pkDraw()}
function pkCat(c){P.cat=c;pkDraw()}
function pkAddItem(name){
  const s=curStat(),n=canonItem(name);if(!n)return;
  const at=s.items.indexOf(n);
  if(at>=0)s.items.splice(at,1);
  else if(s.items.length>=6){toast('A build holds 6 items. Remove one first.');return}
  else s.items.push(n);
  W.dirty=true;pkDraw();
}
function pkPick(i){
  const name=P.list[i];if(name==null)return;
  if(P.kind==='hero'){curStat().hero=name;W.dirty=true;closePicker()}
  else pkAddItem(name);
}
function pkCustom(){
  const v=P.q.trim();if(!v)return;
  if(P.kind==='hero'){curStat().hero=canonHero(v);W.dirty=true;closePicker()}
  else{pkAddItem(v);P.q='';$('pk-q').value='';pkDraw()}
}
function pkRemove(i){curStat().items.splice(i,1);W.dirty=true;pkDraw()}
function pkKey(e){
  if(e.key!=='Enter')return;
  e.preventDefault();
  const q=P.q.trim().toLowerCase();if(!q)return;
  const exact=P.list.findIndex(x=>x.toLowerCase()===q);
  if(exact>=0)pkPick(exact);
  else if(P.list.length===1)pkPick(0);
  else pkCustom();
  if(P&&P.kind==='items'){P.q='';$('pk-q').value='';pkDraw()}
}
function closePicker(silent){
  if(!P)return;
  P=null;$('picker').classList.remove('open');$('picker').innerHTML='';
  if(!silent&&W)rerender();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Tab'&&(W||P)){
    const root=P?document.querySelector('#picker .dlg'):document.querySelector('#sheetwrap .sheet');
    if(root){const fl=sheetFocusables(root);if(fl.length){const f=fl[0],l=fl[fl.length-1],a=document.activeElement;
      if(!root.contains(a)){e.preventDefault();f.focus()}
      else if(e.shiftKey&&a===f){e.preventDefault();l.focus()}
      else if(!e.shiftKey&&a===l){e.preventDefault();f.focus()}}}
    return;
  }
  if(e.key!=='Escape')return;
  if(P)closePicker();else if(W)closeSheet();
});
$('sheetwrap').addEventListener('mousedown',e=>{if(e.target.id==='sheetwrap')closeSheet()});
$('picker').addEventListener('mousedown',e=>{if(e.target.id==='picker')closePicker()});

/* ---------- teams page ---------- */

function viewTeams(){

function addTeam(){S.teams.push(newTeam('Team '+(S.teams.length+1)));render()}
function delTeam(id){if(confirm('Remove this team'+(Object.values(S.matches).some(r=>r.ta===id||r.tb===id)?' and its saved results? Matches against it are cleared too.':'?'))){S.teams=S.teams.filter(t=>t.id!==id);render()}}
function moveTeam(i,d){const j=i+d;if(j<0||j>=S.teams.length)return;[S.teams[i],S.teams[j]]=[S.teams[j],S.teams[i]];render()}
function setTeam(id,v){teamById(id).name=v;save()}
function setPlayer(tid,pid,f,v){teamById(tid).players.find(p=>p.id===pid)[f]=v;save()}
function addPlayer(tid){teamById(tid).players.push({id:uid(),name:'',role:'Sub'});render()}
function delPlayer(tid,pid){const t=teamById(tid);if(JSON.stringify(S.matches).includes(pid)&&!confirm('This player has stats in saved matches. Remove the player anyway?'))return;t.players=t.players.filter(p=>p.id!==pid);render()}
function setGrp(id,v){S.grp[id]=v;render()}

/* ---------- rankings page ---------- */

  else h+=`<div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Player</th><th>ML username</th><th>Team</th><th>Role</th><th class="n">Games</th><th class="n">K</th><th class="n">D</th><th class="n">A</th><th class="n">KDA</th><th class="n">Kills/game</th><th>Main hero</th><th class="n">Win MVP</th><th class="n">Lose MVP</th></tr></thead><tbody>
    ${P1.rows.map((x,i)=>`<tr class="${P1.st+i<3?'adv':''} role-${x.p.role}"><td class="rk">${P1.st+i+1}</td><td><b>${esc(pname(x.p))}</b></td><td>${esc(x.p.ign||'-')}</td><td>${esc(x.team.name)}</td><td><span class="rtxt">${x.p.role}</span></td><td class="n">${x.g}</td><td class="n">${x.k}</td><td class="n">${x.d}</td><td class="n">${x.a}</td><td class="n"><b>${x.kda.toFixed(2)}</b></td><td class="n">${x.avgk.toFixed(1)}</td><td>${esc(x.mainHero||'-')}</td><td class="n">${x.mvp}</td><td class="n">${x.lmvp}</td></tr>`).join('')}
    </tbody></table></div>${P1.html}`;
  h+='</div>';

    ${st.map((s,i)=>`<tr><td class="rk">${i+1}</td><td><b>${esc(s.t.name)}</b></td><td class="n">${esc(tagOf(s.t.id))}</td><td class="n">${s.mw}-${s.ml}</td><td class="n">${s.gw}-${s.gl}</td><td class="n">${s.gw-s.gl>0?'+':''}${s.gw-s.gl}</td><td class="n">${s.k}</td><td class="n">${s.d}</td><td class="n">${s.a}</td></tr>`).join('')}
    </tbody></table></div></div>`;

}

      </tbody></table></div>${PH.html}</div>`;

      ${ROLES.map(r=>`<tr class="role-${r}"><td><span class="rd"></span> <span class="rtxt">${r}</span></td><td>${Object.entries(D.roleH[r]||{}).sort((a,b)=>b[1].picks-a[1].picks||b[1].wins-a[1].wins).slice(0,3).map(([n,v])=>`${esc(n)} (${v.picks}, ${pct(v.wins,v.picks)}%)`).join(', ')||'<span class="mute">No data</span>'}</td></tr>`).join('')}

/* ---------- deeper analysis ---------- */
let anTab='overview',anPlayer='';
function setAnTab(t){anTab=t;render()}
function setAnPlayer(v){anPlayer=v;render()}
function gameRecs(){
  const recs=[],games=[];
  build().all.forEach(m=>{
    if(!m.rec||!m.a||!m.b||m.ff)return;
    m.rec.games.forEach((g,gi)=>{
      if(!g.win)return;
      const gm={m,gi,g,rows:{a:[],b:[]}};
      ['a','b'].forEach(side=>{
        const tid=side==='a'?m.a:m.b,t=teamById(tid);if(!t)return;
        const mv=side==='a'?g.mvpA:g.mvpB;
        t.players.forEach(p=>{
          const s=(g.stats||{})[p.id];if(!s)return;
          const won=g.win===side;
          const r={m,gi,side,teamId:tid,oppId:side==='a'?m.b:m.a,p,pid:p.id,k:s.k||0,d:s.d||0,a:s.a||0,
            hero:canonHero(s.hero),items:(s.items||[]).map(canonItem).filter(Boolean),won,
            mvp:won&&mv===p.id,lmvp:!won&&mv===p.id};
          r.kda=(r.k+r.a)/Math.max(r.d,1);
          recs.push(r);gm.rows[side].push(r);
        });
      });
      games.push(gm);
    });
  });
  return {recs,games};
}
function placingMap(b){
  const mp={};let fin,sf;
  if(b.fin){fin=b.fin;sf=b.sf||[]}
  else if(b.rounds.length>=2){fin=b.rounds[b.rounds.length-1].ms[0];sf=b.rounds[b.rounds.length-2].ms}
  else return mp;
  if(fin&&fin.winner){mp[fin.winner]='Champion';mp[fin.winner===fin.a?fin.b:fin.a]='Runner-up'}
  (sf||[]).forEach(m=>{if(m.winner&&!m.ff){const lo=m.winner===m.a?m.b:m.a;if(lo&&!mp[lo])mp[lo]='3rd place (shared)'}});
  if(b.mode==='rr'&&fin&&fin.winner&&b.G.A.table[2]&&!mp[b.G.A.table[2].id])mp[b.G.A.table[2].id]='3rd place';
  return mp;
}
const sd=a=>{if(a.length<2)return 0;const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/a.length)};
const pc=(w,n)=>n?Math.round(100*w/n):0;
const meter=(v)=>`<span class="meter"><i style="width:${Math.min(100,v)}%"></i></span>`;
const emptyNote=t=>`<p class="mute" style="margin:0">${t}</p>`;

  h+=`<section class="sec"><h3>Team shortlist</h3><div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th></th><th>Team</th><th>Result</th><th class="n">Matches</th><th class="n">Games</th><th class="n">Game diff</th><th class="n">Winning MVPs</th><th class="n">Team KDA</th></tr></thead><tbody>
  ${list.map((s,i)=>`<tr class="${i===0?'adv':''}"><td class="rk">${i+1}</td><td><b>${esc(s.t.name)}</b></td><td>${esc(pl[s.t.id]||'-')}</td><td class="n">${s.mw}-${s.ml}</td><td class="n">${s.gw}-${s.gl}</td><td class="n">${s.gw-s.gl>0?'+':''}${s.gw-s.gl}</td><td class="n">${mvpBy[s.t.id]||0}</td><td class="n">${((s.k+s.a)/Math.max(s.d,1)).toFixed(2)}</td></tr>`).join('')}
  </tbody></table></div><p class="note">Ordered by match wins, then game difference, then winning MVPs. Kills are shown through team KDA only and never decide the order. Use it to compare teams side by side, then read the head-to-head, form and role tables below.</p></div></section>`;
  // head to head
  const ms=b.all.filter(m=>m.a&&m.b&&m.winner);
  const ids=S.teams.filter(t=>ms.some(m=>m.a===t.id||m.b===t.id)).map(t=>t.id);
  const cell=(x,y)=>{
    let w=0,l=0;ms.forEach(m=>{if((m.a===x&&m.b===y)||(m.a===y&&m.b===x)){m.winner===x?w++:l++}});
    if(!w&&!l)return '<td class="n mute">-</td>';

  };

  ${ids.map(x=>`<tr><td><b>${esc(teamById(x).name)}</b></td>${ids.map(y=>x===y?'<td class="n mute">x</td>':cell(x,y)).join('')}</tr>`).join('')}
  </tbody></table></div><p class="note">Read across: the row team's matches won and lost against the column team. Shaded cells mean the row team came out ahead.</p></div></section>`;
  // form
  const ord=[...b.all].filter(m=>m.a&&m.b&&m.winner).sort((x,y)=>x.num-y.num);
  h+=`<section class="sec"><h3>Team form</h3><div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Team</th><th>Results in match order</th><th>Current streak</th></tr></thead><tbody>
  ${ids.map(id=>{
    const res=ord.filter(m=>m.a===id||m.b===id).map(m=>m.winner===id?'W':'L');
    let n=0;for(let i=res.length-1;i>=0&&res[i]===res[res.length-1];i--)n++;
    return `<tr><td><b>${esc(teamById(id).name)}</b></td><td>${res.map(x=>`<span class="fm ${x==='W'?'fw':'fl'}">${x}</span>`).join('')}</td><td>${res.length?(res[res.length-1]==='W'?'Won ':'Lost ')+n:'-'}</td></tr>`;
  }).join('')}
  </tbody></table></div></div></section>`;
  // kill share
  const byTeam={};
  R.recs.forEach(r=>{const t=byTeam[r.teamId]=byTeam[r.teamId]||{k:0,d:0,a:0,pl:{}};t.k+=r.k;t.d+=r.d;t.a+=r.a;const p=t.pl[r.pid]=t.pl[r.pid]||{p:r.p,k:0,d:0,a:0};p.k+=r.k;p.d+=r.d;p.a+=r.a});
  const tids=S.teams.filter(t=>byTeam[t.id]);
  h+=`<section class="sec"><h3>Kill share</h3><div class="two-col">${tids.map(t=>{
    const T=byTeam[t.id],rows=Object.values(T.pl).sort((x,y)=>y.k-x.k);
    return `<div class="card"><h4 class="ct">${esc(t.name)}</h4><div class="tblwrap"><table class="tbl"><thead><tr><th>Player</th><th class="n">Kills</th><th class="n">Assists</th><th class="n">Deaths</th></tr></thead><tbody>
    ${rows.map((p,i)=>`<tr class="role-${p.p.role}"><td><span class="rd"></span> ${esc(pname(p.p))} <span class="rtxt">${p.p.role}</span>${i===0&&pc(p.k,T.k)>=35?' <span class="tag-tie">main carry</span>':''}</td><td class="n"><span class="bar-cell">${pc(p.k,T.k)}%${meter(pc(p.k,T.k))}</span></td><td class="n">${pc(p.a,T.a)}%</td><td class="n">${pc(p.d,T.d)}%</td></tr>`).join('')}
    </tbody></table></div></div>`}).join('')||emptyNote('No player stats yet.')}</div><p class="note">Each number is the player's share of the team's total. A kill share of 35% or more marks a main carry. Deaths show who dies most often.</p></section>`;
  // role matchups
  const lane={},imp={};
  ROLES.forEach(r=>{imp[r]={n:0,agree:0}});

    ROLES.forEach(role=>{
      const ra=gm.rows.a.find(x=>x.p.role===role),rb=gm.rows.b.find(x=>x.p.role===role);
      if(!ra||!rb||ra.kda===rb.kda)return;
      const win=ra.kda>rb.kda?ra:rb,lose=win===ra?rb:ra;
      [[win,1],[lose,0]].forEach(([x,w])=>{const L=lane[x.teamId]=lane[x.teamId]||{};const c=L[role]=L[role]||{w:0,l:0};w?c.w++:c.l++});
      imp[role].n++;if(win.won)imp[role].agree++;

  const lt=S.teams.filter(t=>lane[t.id]);
  h+=`<section class="sec"><h3>Role matchups</h3><div class="two-col"><div class="card"><h4 class="ct">Which role decides games</h4><div class="tblwrap"><table class="tbl"><thead><tr><th>Role</th><th class="n">Lanes compared</th><th class="n">Lane winner's team won</th></tr></thead><tbody>
